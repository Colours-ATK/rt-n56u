name: Build K2P

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Customize config and defaults
        run: |
          set -e
          CFG=trunk/configs/templates/K2P.config
          DH=trunk/user/shared/defaults.h
          DC=trunk/user/shared/defaults.c
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENVPN=y/CONFIG_FIRMWARE_INCLUDE_OPENVPN=n/' "$CFG"
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_SMBD36=y/CONFIG_FIRMWARE_INCLUDE_SMBD36=n/' "$CFG"
          grep -q '^CONFIG_FIRMWARE_INCLUDE_SMARTDNS=' "$CFG" || echo 'CONFIG_FIRMWARE_INCLUDE_SMARTDNS=y' >> "$CFG"
          sed -i 's|#define DEF_WLAN_2G_SSID.*|#define DEF_WLAN_2G_SSID "Redmi_AC2100_2.4G"|' "$DH"
          sed -i 's|#define DEF_WLAN_5G_SSID.*|#define DEF_WLAN_5G_SSID "Redmi_AC2100_5G"|' "$DH"
          sed -i 's|"wl_auth_mode", "psk"|"wl_auth_mode", "open"|' "$DC"
          sed -i 's|"rt_auth_mode", "psk"|"rt_auth_mode", "open"|' "$DC"
          echo "=== verify customizations ==="
          grep -q 'CONFIG_FIRMWARE_INCLUDE_SMARTDNS=y' "$CFG"
          grep -q 'CONFIG_FIRMWARE_INCLUDE_OPENVPN=n' "$CFG"
          grep -q 'CONFIG_FIRMWARE_INCLUDE_SMBD36=n' "$CFG"
          grep -q 'Redmi_AC2100_2.4G' "$DH"
          grep -q 'Redmi_AC2100_5G' "$DH"
          grep -q '"wl_auth_mode", "open"' "$DC"
          grep -q '"rt_auth_mode", "open"' "$DC"
          echo "All customizations applied and verified."

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot kmod cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man pkg-config zlib1g-dev libgmp-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin

      - name: Prepare toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Build K2P
        run: |
          cd trunk
          fakeroot ./build_firmware_modify K2P

      - name: List images
        run: |
          ls -lh trunk/images/
          md5sum trunk/images/*.trx

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: K2P-firmware
          path: trunk/images/*.trx
          if-no-files-found: error